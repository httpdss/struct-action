name: Scheduled Drift Check

on:
  schedule:
    # Run every day at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  scheduled-drift-check:
    name: Daily Structure Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for drift
        id: drift
        continue-on-error: true
        uses: httpdss/structkit-action@v1
        with:
          command: generate
          dry_run: true
          diff: true
          fail_on_diff: true

      - name: Create issue if drift detected
        if: steps.drift.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Structure Drift Detected - ${today}`,
              body: `## ⚠️ Structure Drift Alert

A scheduled check has detected that the project structure has drifted from its definition.

**Detected:** ${today}
**Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

Please review and either:
- Regenerate the structure to match the definition
- Update the structure definition to match the current state

The drift report is available in the workflow artifacts.`,
              labels: ['drift-detection', 'structkit', 'automated']
            })

      - name: Upload drift report
        if: steps.drift.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_id }}
          path: ${{ steps.drift.outputs.diff_file }}
          retention-days: 30
