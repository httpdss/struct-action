name: Generate Structure

on:
  workflow_dispatch:
    inputs:
      struct_file:
        description: 'Structure file to use'
        required: false
        default: '.struct.yaml'

jobs:
  generate:
    name: Generate and Create PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate structure
        uses: httpdss/structkit-action@v1
        with:
          command: generate
          struct_file: ${{ github.event.inputs.struct_file || '.struct.yaml' }}
          output_dir: .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate structure from ${{ github.event.inputs.struct_file || '.struct.yaml' }}"
          title: "🤖 Regenerate Project Structure"
          body: |
            ## Automated Structure Regeneration

            This PR was automatically generated by the StructKit Action.

            **Structure File:** `${{ github.event.inputs.struct_file || '.struct.yaml' }}`
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please review the changes before merging.
          branch: structkit/regenerate-${{ github.run_id }}
          delete-branch: true
          labels: |
            automated
            structkit
