name: Test Action

on:
  push:
    branches: [main, cursor/**]
  pull_request:
  workflow_dispatch:

jobs:
  test-validate:
    name: Test Validate Command
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test structure file
        run: |
          cat > .struct.yaml << 'EOF'
          structure:
            name: test-structure
            description: Test structure for action
            files:
              - path: test-file.txt
                content: "Hello from StructKit!"
          EOF

      - name: Run validate
        uses: ./
        with:
          command: validate
          struct_file: .struct.yaml

  test-generate-dry-run:
    name: Test Generate Dry Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test structure file
        run: |
          cat > .struct.yaml << 'EOF'
          structure:
            name: test-structure
            description: Test structure for action
            files:
              - path: test-output/sample.txt
                content: "Generated by StructKit Action!"
          EOF

      - name: Run generate (dry-run)
        id: generate
        uses: ./
        with:
          command: generate
          struct_file: .struct.yaml
          dry_run: true
          diff: true

      - name: Check outputs
        run: |
          echo "Success: ${{ steps.generate.outputs.success }}"
          echo "Has changes: ${{ steps.generate.outputs.has_changes }}"
          echo "Exit code: ${{ steps.generate.outputs.exit_code }}"

  test-generate-real:
    name: Test Generate (Real)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test structure file
        run: |
          cat > .struct.yaml << 'EOF'
          structure:
            name: test-structure
            description: Test structure for action
            files:
              - path: generated/test.txt
                content: "This file was generated!"
              - path: generated/nested/file.txt
                content: "Nested file content"
          EOF

      - name: Run generate
        uses: ./
        with:
          command: generate
          struct_file: .struct.yaml
          output_dir: .

      - name: Verify generated files
        run: |
          test -f generated/test.txt || (echo "File not created!" && exit 1)
          test -f generated/nested/file.txt || (echo "Nested file not created!" && exit 1)
          echo "Generated files verified successfully!"

  test-custom-version:
    name: Test Custom StructKit Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test structure file
        run: |
          cat > .struct.yaml << 'EOF'
          structure:
            name: test-structure
            description: Test structure
            files:
              - path: version-test.txt
                content: "Testing version"
          EOF

      - name: Run with git installation
        uses: ./
        with:
          command: validate
          struct_file: .struct.yaml
          structkit_version: "https://github.com/httpdss/structkit.git@main"

  test-fail-on-diff:
    name: Test Fail on Diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test structure file
        run: |
          cat > .struct.yaml << 'EOF'
          structure:
            name: test-structure
            description: Test structure
            files:
              - path: drift-test.txt
                content: "This should trigger diff detection"
          EOF

      - name: Run with fail_on_diff (should fail if file doesn't exist)
        id: drift-check
        continue-on-error: true
        uses: ./
        with:
          command: generate
          dry_run: true
          diff: true
          fail_on_diff: true

      - name: Verify failure detection
        if: steps.drift-check.outputs.has_changes == 'true'
        run: echo "Drift detection working correctly!"

  test-extra-args:
    name: Test Extra Arguments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test structure file
        run: |
          cat > .struct.yaml << 'EOF'
          structure:
            name: test-structure
            description: Test structure
            files:
              - path: extra-args-test.txt
                content: "Testing extra args"
          EOF

      - name: Run with extra arguments
        uses: ./
        with:
          command: validate
          struct_file: .struct.yaml
          extra_args: "--verbose"
